name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Checkout fabric-permissions-api (26.3 port)
        uses: actions/checkout@v4
        with:
          repository: Guailoudou/fabric-permissions-api-port
          path: deps/fabric-permissions-api

      - name: Build fabric-permissions-api
        run: |
          cd deps/fabric-permissions-api
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon -x test

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -x test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monkeyutils-26.3
          path: build/libs/*.jar
          if-no-files-found: error
